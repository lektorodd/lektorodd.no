# options specified here will apply to all posts in this folder
freeze: auto

# Enable banner style title blocks
title-block-banner: true

# Enable CC licence appendix
license: "CC BY"

# Default for table of contents
toc: true
toc-title: Innhald
toc-location: right

format:
  lektorodd-lf-typst:
    # Fontane ligg i utvidinga, så PDF-en ikkje er avhengig av kva som er installert
    mainfont: Source Sans 3
    font-paths: ["/_extensions/lektorodd/lektorodd-lf/fonts"]
    codefont: JetBrains Mono
    code-line-numbers: true
    heading-family: Crimson Pro
    heading-weight: 700
