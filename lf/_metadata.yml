# Felles oppsett for alle løysingsforslaga i lf/.
# Kvart løysingsforslag treng difor berre tittel, dato og kategoriar (sjå lf/_mal/).
freeze: auto

author: "Torodd F. Ottestad"
from: markdown+emoji
license: "CC BY"

title-block-banner: true
body-classes: lo-lf
toc: true
toc-title: Innhald
toc-location: right

# Fjernar den doble «# Løysingsforslag ...»-overskrifta og lagar delskilja
filters:
  - ../_extensions/lektorodd/lektorodd-lf/lf.lua

format:
  html: default
  lektorodd-lf-typst:
    # Fontane ligg i utvidinga, så PDF-en ikkje er avhengig av kva som er installert
    font-paths: ["/_extensions/lektorodd/lektorodd-lf/fonts"]
    mainfont: Source Sans 3
    heading-family: Space Grotesk
    codefont: JetBrains Mono
    code-line-numbers: true
    toc: false

format-links:
  - html
  - format: lektorodd-lf-typst
    text: "Last ned som PDF"
